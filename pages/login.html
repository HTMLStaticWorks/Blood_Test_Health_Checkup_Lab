<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login - VitaCore Diagnostics</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">

  <style>
    /* Specific auth page styles */
    .auth-bg {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-card {
      width: 100%;
      max-width: 450px;
      z-index: 1;
    }
    .social-btn {
      background-color: var(--bg-surface-alt);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }
    .social-btn:hover {
      background-color: var(--primary-light);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
  </style>
</head>
<body>
  
  <div class="auth-bg">
    
    <!-- Theme & RTL Toggles -->
    <div class="w-100 d-flex justify-content-end p-3 p-md-4">
      <div class="d-flex gap-2">
        <button id="theme-toggle" class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; border: 1px solid var(--border-color); background-color: var(--bg-surface); color: var(--text-main);" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars" id="theme-icon"></i>
        </button>
        <button id="rtl-toggle" class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; border: 1px solid var(--border-color); background-color: var(--bg-surface); color: var(--text-main);" aria-label="Toggle RTL">
          <i class="bi bi-arrow-left-right"></i>
        </button>
      </div>
    </div>

    <!-- Centered Card Container -->
    <div class="w-100 flex-grow-1 d-flex align-items-center justify-content-center p-3 p-md-4">
      <div class="auth-card reveal-fade mt-0">
      <div class="premium-card p-4 p-sm-5 shadow-lg border-0">
        
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3" style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none;">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M20 40C31.0457 40 40 31.0457 40 20C40 8.9543 31.0457 0 20 0C8.9543 0 0 8.9543 0 20C0 31.0457 8.9543 40 20 40ZM20 8L12 20C12 24.4183 15.5817 28 20 28C24.4183 28 28 24.4183 28 20L20 8Z" fill="#32d3b4"/>
            </svg>
            <span style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;">VitaCore</span>
          </a>
          <h2 class="h4 fw-bold">Welcome Back</h2>
          <p class="text-muted small">Log in to access your digital reports and book tests.</p>
        </div>

        <form id="loginForm" novalidate onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
          <div class="mb-3">
            <label for="email" class="form-label fw-medium small">Email or Mobile Number</label>
            <input type="text" class="form-control form-control-lg bg-surface-alt border-0" id="email" placeholder="patient@example.com" required>
            <div class="invalid-feedback">Please enter your email or mobile.</div>
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label fw-medium small">Password</label>
            <div class="position-relative">
              <input type="password" class="form-control form-control-lg bg-surface-alt border-0 pe-5" id="password" placeholder="••••••••" required>
              <span class="position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer text-muted" id="togglePassword" style="z-index: 5;">
                <i class="bi bi-eye"></i>
              </span>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label small text-muted user-select-none" for="rememberMe">Remember Me</label>
            </div>
            <a href="#" class="small fw-medium text-decoration-none">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold mb-4">Login to Dashboard</button>

          <div class="position-relative text-center mb-4">
            <hr class="text-muted opacity-25">
            <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface text-muted small">or continue with</span>
          </div>

          <div class="d-flex flex-wrap gap-2 mb-4">
            <button type="button" class="btn social-btn flex-grow-1 rounded-pill py-2 fw-medium d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-google text-danger"></i>
            </button>
            <button type="button" class="btn social-btn flex-grow-1 rounded-pill py-2 fw-medium d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-facebook text-primary"></i>
            </button>
            <button type="button" class="btn social-btn flex-grow-1 rounded-pill py-2 fw-medium d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-apple"></i>
            </button>
          </div>

          <p class="text-center small text-muted mb-0">Don't have an account? <a href="signup.html" class="fw-bold text-decoration-none">Sign Up</a></p>
        </form>

      </div>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
  <script>
    // Password visibility toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    });
    
    // Basic validation
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function(e) {
      if(!document.getElementById('email').value || !document.getElementById('password').value) {
        e.preventDefault();
        e.stopPropagation();
        form.classList.add('was-validated');
      }
    });
  </script>
</body>
</html>
